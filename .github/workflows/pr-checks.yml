# ============================================================
# 🎯 Цель: Проверка качества PR и пуша в dev
# 🚀 Запуск: При PR или пуше в dev
# 📂 Хранилище слов: .github/bad-words.txt
# ============================================================

name: PR Quality Checks

on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - '**/*.md'
      - '**/*.yml'
      - '.github/workflows/*.yml'
  push:
    branches: [ dev ]
    paths:
      - '**/*.md'
      - '**/*.yml'
      - '.github/workflows/*.yml'

jobs:
  bad-words:
    name: 🚫 Bad Words Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for bad words
        run: |
          # Проверяем, есть ли .md файлы в изменениях
          if ! git diff --name-only HEAD~1 HEAD | grep -q "\.md$"; then
            echo "⏭️ Нет .md файлов в изменениях — скипаем"
            exit 0
          fi

          # Читаем список плохих слов из файла
          BAD_WORDS=$(cat .github/bad-words.txt | tr '\n' '|' | sed 's/|$//')
          if [ -z "$BAD_WORDS" ]; then
            echo "⚠️ Файл .github/bad-words.txt пуст или отсутствует"
            exit 0
          fi

          # Ищем плохие слова
          if grep -r -n -E -i "\b($BAD_WORDS)\b" . --include="*.md" --exclude-dir=".git" --exclude="personal-hotkeys.md"; then
            echo "❌ Найдены запрещённые слова в Markdown-файлах"
            exit 1
          else
            echo "✅ Все чисто"
          fi

  secrets-check:
    name: 🔒 Secrets Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          # Проверяем, есть ли .md или .txt файлы в изменениях
          if ! git diff --name-only HEAD~1 HEAD | grep -qE "\.(md|txt)$"; then
            echo "⏭️ Нет .md или .txt файлов в изменениях — скипаем"
            exit 0
          fi

          SECRET_PATTERNS="password|secret|key|token|api_key|private_key|JWT|AUTH_TOKEN"
          if grep -r -n -E -i "$SECRET_PATTERNS" . \
            --include="*.md" --include="*.txt" \
            --exclude-dir=".git" \
            --exclude="secrets.md" \
            --exclude="саморазвитие/hacker101/CHECKLIST.md" \
            --exclude=".github/workflows/pr-checks.yml" \
            | grep -v ".gitignore"; then
            echo "❌ Обнаружены подозрительные строки (пароли, ключи, токены)"
            echo "Проверь, что ты не закоммитил секреты!"
            exit 1
          else
            echo "✅ Секретов не найдено"
          fi

  folder-structure:
    name: 📂 Folder Structure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required folders
        run: |
          # Список папок, которые должны существовать
          REQUIRED=(
            ".github"
            "books"
            "college"
            "S.E.E.D.1956"
            "саморазвитие"
            "шаблоны"
            "images"
            "github_project"
          )

          # Список папок/файлов, которые НЕ должны быть удалены
          PROTECTED=(
            ".gitignore"
            "about_me.md"
            "AUTHORS"
            "README.md"
            "шаблоны/attention"
            "саморазвитие/Ivanov_M_V"
            "саморазвитие/students"
            "images/diagrams"
            "images/icons"
            "images/memes"
            "images/screenshots"
            "images/README.md"
            "books/Программирование"
            ".github/workflows"
            ".github/workflows/CODEOWNERS"
            ".github/workflows/telegram-notify.yml"
          )

          MISSING=()
          for dir in "${REQUIRED[@]}"; do
            if [ ! -d "$dir" ]; then
              MISSING+=("$dir")
            fi
          done

          for item in "${PROTECTED[@]}"; do
            if [ ! -e "$item" ]; then
              MISSING+=("$item")
            fi
          done

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "❌ Отсутствуют обязательные элементы:"
            printf '%s\n' "${MISSING[@]}"
            exit 1
          else
            echo "✅ Все обязательные элементы на месте"
          fi

  commitlint:
    name: 📋 Commit Message Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check all commit messages
        run: |
          FAILED=0
          for COMMIT in $(git log origin/dev..HEAD --pretty=%H); do
            MSG=$(git log -1 --pretty=%B $COMMIT)
            AUTHOR=$(git log -1 --pretty=%an $COMMIT)

            # 1. Проверка на пустой коммит
            if [ -z "$MSG" ]; then
              echo "❌ Commit $COMMIT пустой"
              FAILED=1
              continue
            fi

            # 2. Проверка на BREAKING CHANGE (всегда валидный)
            if echo "$MSG" | grep -qE "^BREAKING CHANGE: .+"; then
              echo "✅ Commit $COMMIT — BREAKING CHANGE (пропускаем)"
              continue
            fi

            # 3. Проверка формата (type(scope)?: subject)
            if ! echo "$MSG" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .{1,100}"; then
              echo "❌ Commit $COMMIT не соответствует Conventional Commits:"
              echo "$MSG"
              echo ""
              FAILED=1
              continue
            fi

            # 4. Проверка на #notify (только если автор не Mikhail-69)
            if [ "$AUTHOR" != "Mikhail-69" ]; then
              if echo "$MSG" | grep -q "#notify$"; then
                echo "❌ Commit $COMMIT содержит #notify в конце:"
                echo "$MSG"
                echo ""
                FAILED=1
              fi
            fi

            # 5. Проверка, что после двоеточия есть текст
            SUBJECT=$(echo "$MSG" | sed -n 's/^[^:]*: \(.*\)/\1/p')
            if [ -z "$SUBJECT" ] || [ "$SUBJECT" = " " ]; then
              echo "❌ Commit $COMMIT: после двоеточия нет текста:"
              echo "$MSG"
              echo ""
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "❌ Найдены коммиты с неправильным форматом"
            exit 1
          else
            echo "✅ Все коммиты соответствуют Conventional Commits"
          fi

  link-check:
    name: 🔗 Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        run: |
          # Проверяем, есть ли .md файлы в изменениях
          if ! git diff --name-only HEAD~1 HEAD | grep -q "\.md$"; then
            echo "⏭️ Нет .md файлов в изменениях — скипаем"
            exit 0
          fi

          echo "🔍 Проверяем ссылки в изменённых .md файлах..."
          BROKEN=0
          for FILE in $(git diff --name-only HEAD~1 HEAD | grep "\.md$"); do
            # Ищем все ссылки вида [текст](путь) и [текст](http...)
            grep -oP '\[.*?\]\([^)]+\)' "$FILE" | while read -r LINK; do
              URL=$(echo "$LINK" | sed -n 's/.*(\(.*\))/\1/p')
              # Проверяем, что URL не пустой
              if [ -z "$URL" ]; then
                echo "❌ В $FILE пустая ссылка: $LINK"
                BROKEN=1
                continue
              fi
              # Если ссылка не начинается с http:// или https://, считаем её локальной
              if ! echo "$URL" | grep -qE '^https?://'; then
                # Проверяем существование локального файла
                if [ ! -f "$URL" ] && [ ! -d "$URL" ]; then
                  echo "❌ В $FILE битая локальная ссылка: $LINK"
                  BROKEN=1
                fi
              fi
            done
          done

          if [ $BROKEN -ne 0 ]; then
            echo "❌ Найдены битые ссылки"
            exit 1
          else
            echo "✅ Все ссылки корректны"
          fi