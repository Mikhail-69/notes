# ============================================================
# 🎯 Цель: Автоматическое форматирование Markdown-файлов
# 🚀 Запуск: При каждом пуше или PR в ветку dev
# ============================================================

name: Auto Format

on:
  push:
    branches: [ dev ]
    paths:
      - '**/*.md'
  pull_request:
    branches: [ dev ]
    paths:
      - '**/*.md'

jobs:
  format:
    name: 🔧 Auto-format Markdown
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Fix Markdown issues
        run: markdownlint '**/*.md' --fix --ignore 'шаблоны/personal-hotkeys.md' || true

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: авто-форматирование Markdown"
          branch: ${{ github.head_ref }}